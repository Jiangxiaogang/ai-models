<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 模型使用体验对比</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --line:#e3e7f0;
    --line-2:#edf0f7;
    --txt:#16202f;
    --txt-2:#3d4759;
    --muted:#6b7689;
    --radius:16px;
  }
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    color:var(--txt);
    background:
      radial-gradient(900px 520px at 8% -10%, rgba(14,159,184,.10), transparent 60%),
      radial-gradient(820px 520px at 96% -4%, rgba(123,97,232,.10), transparent 55%),
      radial-gradient(900px 620px at 50% 118%, rgba(224,88,140,.07), transparent 62%),
      var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    line-height:1.6;
    font-size:14.5px;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d2d8e5;border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#c0c8d8}

  /* ---------- List head ---------- */
  main{max-width:960px;margin:0 auto;padding:22px 24px 60px}
  .list-head{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:10px;
    padding:12px 0 10px;margin-top:0;
    background:rgba(245,247,251,.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid transparent;
  }
  .ghost-btn{
    margin-left:auto;font:inherit;font-size:12.5px;color:#374151;cursor:pointer;
    padding:5px 13px;border-radius:9px;border:1px solid var(--line);
    background:#fff;transition:border-color .2s,background .2s,color .2s;
  }
  .ghost-btn:hover{border-color:#c3cbdb;background:#f8fafc}
  .ghost-btn:active{transform:translateY(1px)}
  .sorter{display:flex;gap:3px;padding:3px;border-radius:9px;background:#e9edf5}
  .sort-btn{
    font:inherit;font-size:12px;color:#5d6779;cursor:pointer;
    padding:4px 11px;border-radius:7px;border:0;background:none;
    transition:background .2s,color .2s,box-shadow .2s;
  }
  .sort-btn:hover{color:#1f2937}
  .sort-btn.active{background:#fff;color:#111827;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.12)}

  /* ---------- Compact rows ---------- */
  .list{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .row{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(15,23,42,.04);
    transition:box-shadow .25s,border-color .25s;
  }
  .row:hover{border-color:#d3dae7;box-shadow:0 8px 24px -16px rgba(15,23,42,.28)}
  .row.open{
    border-color:#ccd5e6;
    box-shadow:inset 3px 0 0 var(--accent),0 10px 30px -20px rgba(15,23,42,.3);
  }
  .row-head{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:12px 16px;margin:0;border:0;background:none;cursor:pointer;
    font:inherit;color:inherit;text-align:left;border-radius:var(--radius);
  }
  .row-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .idx{
    flex:0 0 auto;font:700 11px/1 ui-monospace,Consolas,monospace;
    color:#1f2937;background:#f1f5fa;
    padding:6px 7px;border-radius:8px;
  }
  .name-wrap{flex:0 0 auto;display:flex;align-items:baseline;gap:8px;min-width:0;max-width:44%}
  .name{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-tags{flex:1 1 auto;display:flex;gap:5px;overflow:hidden;min-width:0}
  .mini-tags span{
    flex:0 0 auto;font-size:11px;color:#5d6779;padding:2px 8px;border-radius:99px;
    background:#f2f5fa;border:1px solid #e8ecf4;white-space:nowrap;
  }
  .score-pill{
    flex:0 0 auto;font:700 13px/1.5 ui-monospace,Consolas,monospace;
    padding:3px 10px;border-radius:8px;border:1px solid transparent;min-width:48px;text-align:center;
  }
  .excellent{color:#0f9d64;background:#e8f8f0;border-color:#bfeeda}
  .good{color:#0b8aa6;background:#e6f6fa;border-color:#bfe8f1}
  .mid{color:#a26c00;background:#fdf4dd;border-color:#f3e2b4}
  .low{color:#c93b3b;background:#fdecec;border-color:#f6cccc}
  .chev{flex:0 0 auto;width:17px;height:17px;color:#98a2b3;transition:transform .3s,color .3s}
  .row.open .chev{transform:rotate(180deg);color:var(--accent)}

  /* ---------- Expand area ---------- */
  .row-body{
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .38s cubic-bezier(.22,.8,.24,1);
  }
  .row.open .row-body{grid-template-rows:1fr}
  .row-body-inner{overflow:hidden;min-height:0}
  .detail{padding:2px 16px 18px;border-top:1px solid var(--line-2);margin-top:0}
  .tagline{margin:12px 0 0;font-size:13.5px;color:var(--txt-2)}

  /* pricing */
  .price-mini{
    flex:0 0 auto;font:600 11px/1 ui-monospace,Consolas,monospace;color:#55617a;
    background:#f6f8fb;border:1px solid #e6eaf2;border-radius:6px;
    padding:4px 7px;white-space:nowrap;
  }
  .price-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px}
  .price-item{
    display:flex;align-items:baseline;gap:6px;padding:6px 11px;border-radius:9px;
    background:#f6f9fc;border:1px solid #e6ebf3;
  }
  .price-item .pk{font-size:11px;color:var(--muted)}
  .price-item b{font:700 13px/1 ui-monospace,Consolas,monospace;color:#1f2b3d}
  .price-item .pu{font-size:10.5px;color:#98a2b3}
  .price-note{flex:0 1 auto;font-size:11px;color:#a26c00;line-height:1.5}

  /* task record */
  .task-box{
    margin-top:12px;padding:10px 12px;border-radius:10px;
    background:#f3f8ff;border:1px solid #dbe8fb;
  }
  .task-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .task-tag{
    font-size:10px;letter-spacing:.08em;color:#2563eb;
    background:#e2ecfd;padding:2px 7px;border-radius:5px;
  }
  .task-name{font-size:12.5px;font-weight:600;color:#1e3a5f}
  .task-status{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:99px}
  .task-status.doing{color:#0b6ea6;background:#e2f2fb}
  .task-status.done{color:#0f7a4d;background:#e3f7ec}
  .task-status.partial{color:#9a6700;background:#fdf3da}
  .task-status.fail{color:#b33434;background:#fdeaea}
  .task-points{list-style:none;margin:7px 0 0;padding:0;display:grid;gap:3px;font-size:12px;color:#44526b}
  .task-points li{position:relative;padding-left:12px}
  .task-points li::before{
    content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:#7aa6e0;
  }
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tags span{
    font-size:11px;color:var(--accent);padding:2px 9px;border-radius:99px;
    background:#f4f8fc;border:1px solid #dfe7f1;
  }

  /* dimension bars */
  .dims{display:grid;grid-template-columns:1fr 1fr;gap:7px 26px;margin-top:14px}
  @media(max-width:700px){.dims{grid-template-columns:1fr}}
  .dim{display:grid;grid-template-columns:92px 1fr 30px;align-items:center;gap:9px;font-size:12px}
  .dim-label{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:5px;border-radius:99px;background:#edf0f7;overflow:hidden}
  .bar i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-soft));
    transition:width .9s cubic-bezier(.2,.8,.2,1);
  }
  .dim-val{font:600 11.5px/1 ui-monospace,Consolas,monospace;text-align:right;color:#4a5568}

  /* pros / cons */
  .pc-grid{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
  @media(min-width:720px){.pc-grid{grid-template-columns:1fr 1fr}}
  .pc{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line-2)}
  .pc h4{margin:0 0 5px;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:650}
  .pc ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:12.5px;color:#414c5f}
  .pc li{position:relative;padding-left:14px}
  .pc li::before{
    content:"";position:absolute;left:1px;top:.58em;width:6px;height:6px;border-radius:2px;
    transform:rotate(45deg);background:#12a876;
  }
  .pc.cons li::before{background:#d95252;border-radius:50%;transform:none}

  .scenes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
  .scenes .label{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-right:1px}
  .scene{
    font-size:11.5px;padding:2px 9px;border-radius:6px;
    border:1px solid #e4e9f2;background:#fff;color:#4a5568;
  }
  .note{
    margin:12px 0 0;padding:9px 12px;font-size:12.5px;color:#566174;
    border-left:2px solid var(--accent);background:#fafbfd;border-radius:0 8px 8px 0;
  }
  .stamp{margin:10px 0 0;font-size:10.5px;color:#9aa4b5;letter-spacing:.04em}

  /* empty */
  .empty{
    text-align:center;padding:48px 20px;border-radius:16px;
    border:1px dashed #ccd4e2;background:rgba(255,255,255,.7);
  }
  .empty svg{width:46px;height:46px;color:#0e9fb8;opacity:.8}
  .empty h3{margin:8px 0 4px;font-size:17px}
  .empty p{margin:0 auto;max-width:400px;color:var(--muted);font-size:13px}

  @media(max-width:600px){
    main{padding:16px 18px 48px}
    .mini-tags{display:none}
    .price-mini{display:none}
    .name-wrap{max-width:none;flex:1 1 auto}
    .row-head{padding:11px 13px;gap:10px}
    .detail{padding:2px 13px 16px}
    .score-pill{min-width:44px}
  }
  @media print{
    body{background:#fff}
    .list-head .ghost-btn,.chev{display:none}
    .row{break-inside:avoid}
    .row-body{grid-template-rows:1fr !important}
    .bar i{width:var(--w,0)}
  }
</style>
</head>

/* 文档的最后更新时间，录入内容时同步修改 */
const UPDATED = '2026-11-27';

/* =========================================================
   渲染逻辑
   ========================================================= */
const ACCENTS = [
  ['#0e9fb8', '#7fd8e8'],
  ['#7b61e8', '#c3b7fa'],
  ['#e0588c', '#f5b0c8'],
  ['#12a876', '#8ae0c2'],
  ['#d08a00', '#f5d08a'],
  ['#3b7bdd', '#a6c4f4']
];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));
const round1 = (n) => Math.round(n * 10) / 10;
const band = (s) => (s >= 8.5 ? 'excellent' : s >= 7 ? 'good' : s >= 5.5 ? 'mid' : 'low');

function avgOf(m) {
  const vals = DIMENSIONS
    .map((d) => Number(m.scores && m.scores[d.key]))
    .filter((n) => Number.isFinite(n) && n > 0);
  return vals.length ? round1(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
}

let sortMode = 'price';

function sortedModels() {
  const arr = MODELS.map((m, i) => ({ m, i, avg: avgOf(m) }));
  if (sortMode === 'name') {
    arr.sort((a, b) => a.m.name.localeCompare(b.m.name, 'en') || a.i - b.i);
  } else if (sortMode === 'score') {
    arr.sort((a, b) => b.avg - a.avg || a.i - b.i);
  } else {
    arr.sort((a, b) => {
      const ca = costOf(a.m);
      const cb = costOf(b.m);
      if (ca === null && cb === null) return a.i - b.i;
      if (ca === null) return 1;
      if (cb === null) return -1;
      return ca - cb || a.i - b.i;
    });
  }
  return arr;
}

function fmt(n) {
  return n > 0 ? n.toFixed(1) : '—';
}

/* 价格：pricing = { input: 数字, output: 数字, unit: 'USD' }，单位换算为每 1M tokens */
function fmtPrice(n) {
  if (!Number.isFinite(n)) return '—';
  const s = n >= 1 ? n.toFixed(2) : n.toFixed(3);
  return s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
}

function hasPrice(v) {
  return Array.isArray(v)
    ? v.length === 2 && Number.isFinite(v[0]) && Number.isFinite(v[1])
    : Number.isFinite(v);
}

function pv(v) {
  return Array.isArray(v) ? fmtPrice(v[0]) + '~' + fmtPrice(v[1]) : fmtPrice(v);
}

function priceText(p) {
  if (!p || !hasPrice(p.input) || !hasPrice(p.output)) return '';
  const cur = p.unit === 'CNY' ? '¥' : '$';
  return cur + pv(p.input) + ' / ' + cur + pv(p.output);
}

function priceBox(p, rgb) {
  if (!p) return '';
  const cur = p.unit === 'CNY' ? '¥' : '$';
  const itemStyle = rgb
    ? ' style="background:rgba(' + rgb + ',.07);border-color:rgba(' + rgb + ',.22)"'
    : '';
  const numStyle = rgb ? ' style="color:rgb(' + rgb + ')"' : '';
  let html = '';
  if (hasPrice(p.input)) {
    html += '<div class="price-item"' + itemStyle + '><span class="pk">输入</span><b' + numStyle + '>' + cur + pv(p.input) +
            '</b><span class="pu">/ 1M tokens</span></div>';
  }
  if (hasPrice(p.output)) {
    html += '<div class="price-item"' + itemStyle + '><span class="pk">输出</span><b' + numStyle + '>' + cur + pv(p.output) +
            '</b><span class="pu">/ 1M tokens</span></div>';
  }
  if (p.note) html += '<span class="price-note">' + esc(p.note) + '</span>';
  return html ? '<div class="price-box">' + html + '</div>' : '';
}

function taskBox(t) {
  if (!t) return '';
  const states = {
    doing: ['进行中', 'doing'],
    done: ['已完成', 'done'],
    partial: ['部分通过', 'partial'],
    fail: ['未通过', 'fail']
  };
  const st = states[t.status] || states.doing;
  const points = (t.points || []).map((p) => '<li>' + esc(p) + '</li>').join('');
  return '<div class="task-box">' +
    '<div class="task-head">' +
      '<span class="task-tag">统一任务</span>' +
      '<span class="task-name">' + esc(t.label || '') + '</span>' +
      '<span class="task-status ' + st[1] + '">' + st[0] + '</span>' +
    '</div>' +
    (points ? '<ul class="task-points">' + points + '</ul>' : '') +
  '</div>';
}

/* 价格热度：按输入+输出的综合成本做对数映射，绿(便宜) -> 红(贵) */
function costOf(m) {
  const p = m.pricing;
  if (!p) return null;
  const mid = (v) => (Array.isArray(v) ? (v[0] + v[1]) / 2 : v);
  const i = mid(p.input);
  const o = mid(p.output);
  return Number.isFinite(i) && Number.isFinite(o) ? i + o : null;
}

function priceColor(t) {
  const stops = [
    [21, 128, 61],
    [77, 124, 15],
    [161, 98, 7],
    [194, 65, 12],
    [185, 28, 28]
  ];
  const x = Math.max(0, Math.min(1, t)) * (stops.length - 1);
  const i = Math.min(Math.floor(x), stops.length - 2);
  const f = x - i;
  const a = stops[i];
  const b = stops[i + 1];
  return [0, 1, 2]
    .map((k) => Math.round(a[k] + (b[k] - a[k]) * f))
    .join(',');
}

function renderList() {
  const host = document.getElementById('modelList');
  const toggle = document.getElementById('toggleAll');
  const openNames = new Set(
    Array.from(document.querySelectorAll('.row.open'))
      .map((r) => r.dataset.name)
  );
  const list = sortedModels();
  const costs = list.map(({ m }) => costOf(m)).filter((v) => v !== null);
  const minC = costs.length ? Math.min.apply(null, costs) : 0;
  const maxC = costs.length ? Math.max.apply(null, costs) : 0;
  const tOf = (m) => {
    const c = costOf(m);
    if (c === null || maxC <= minC) return 0;
    return (Math.log(c) - Math.log(minC)) / (Math.log(maxC) - Math.log(minC));
  };

  toggle.style.display = list.length ? '' : 'none';

  if (!list.length) {
    host.innerHTML =
      '<div class="empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">' +
          '<circle cx="12" cy="12" r="9"></circle>' +
          '<path d="M12 3v18M3 12h18" opacity=".4"></path>' +
          '<circle cx="12" cy="12" r="3.4"></circle>' +
        '</svg>' +
        '<h3>等待第一个模型</h3>' +
        '<p>每提供一份使用体验，这里就会新增一条记录，点击条目即可展开详情。</p>' +
      '</div>';
    return;
  }

  host.innerHTML = list.map(({ m, avg }, idx) => {
    const acc = ACCENTS[idx % ACCENTS.length];
    const rank = String(idx + 1).padStart(2, '0');
    const rgb = priceColor(tOf(m));
    const priceStyle = ' style="color:rgb(' + rgb + ');background:rgba(' + rgb + ',.09);border-color:rgba(' + rgb + ',.26)"';

    const dims = DIMENSIONS.map((d) => {
      const s = Number(m.scores && m.scores[d.key]) || 0;
      const w = Math.max(0, Math.min(100, s * 10));
      return '<div class="dim">' +
        '<span class="dim-label">' + d.label + '</span>' +
        '<div class="bar"><i data-w="' + w + '" style="--w:' + w + '%"></i></div>' +
        '<span class="dim-val">' + fmt(s) + '</span>' +
      '</div>';
    }).join('');

    const miniTags = (m.tags || []).slice(0, 3)
      .map((t) => '<span>' + esc(t) + '</span>').join('');

    const pros = (m.pros || []).length
      ? '<div class="pc pros"><h4>亮点</h4><ul>' + m.pros.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul></div>'
      : '';
    const cons = (m.cons || []).length
      ? '<div class="pc cons"><h4>短板</h4><ul>' + m.cons.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul></div>'
      : '';
    const pcBlock = (pros || cons) ? '<div class="pc-grid">' + pros + cons + '</div>' : '';

    const scenes = (m.scenes || []).length
      ? '<div class="scenes"><span class="label">适合</span>' +
          m.scenes.map((s) => '<span class="scene">' + esc(s) + '</span>').join('') + '</div>'
      : '';

    return '<div class="row" data-name="' + esc(m.name) + '" style="--accent:' + acc[0] + ';--accent-soft:' + acc[1] + '">' +
      '<button class="row-head" type="button" aria-expanded="false">' +
        '<span class="idx">' + rank + '</span>' +
        '<span class="name-wrap">' +
          '<span class="name">' + esc(m.name) + '</span>' +
        '</span>' +
        '<span class="mini-tags">' + miniTags + '</span>' +
        (priceText(m.pricing) ? '<span class="price-mini"' + priceStyle + '>' + priceText(m.pricing) + '</span>' : '') +
        '<span class="score-pill ' + band(avg) + '">' + fmt(avg) + '</span>' +
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
      '</button>' +
      '<div class="row-body"><div class="row-body-inner">' +
        '<div class="detail">' +
          (m.tagline ? '<p class="tagline">' + esc(m.tagline) + '</p>' : '') +
          priceBox(m.pricing, rgb) +
          ((m.tags || []).length ? '<div class="tags">' + m.tags.map((t) => '<span>' + esc(t) + '</span>').join('') + '</div>' : '') +
          '<div class="dims">' + dims + '</div>' +
          taskBox(m.task) +
          pcBlock + scenes +
          (m.note ? '<p class="note">' + esc(m.note) + '</p>' : '') +
          (m.date ? '<p class="stamp">记录于 ' + esc(m.date) + '</p>' : '') +
        '</div>' +
      '</div></div>' +
    '</div>';
  }).join('');

  if (openNames.size) {
    document.querySelectorAll('.row').forEach((row) => {
      if (!openNames.has(row.dataset.name)) return;
      row.classList.add('open');
      row.querySelector('.row-head').setAttribute('aria-expanded', 'true');
      fillBars(row);
    });
  }

  bindRows();
}

function syncToggle() {
  const rows = Array.from(document.querySelectorAll('.row'));
  const toggle = document.getElementById('toggleAll');
  const allOpen = rows.length > 0 && rows.every((r) => r.classList.contains('open'));
  toggle.textContent = allOpen ? '全部收起' : '全部展开';
}

function fillBars(row) {
  row.querySelectorAll('.bar i').forEach((el) => {
    el.style.width = (el.dataset.w || 0) + '%';
  });
}

function bindRows() {
  document.querySelectorAll('.row-head').forEach((btn) => {
    btn.addEventListener('click', () => {
      const row = btn.closest('.row');
      const open = row.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      if (open) fillBars(row);
      syncToggle();
    });
  });

  const toggle = document.getElementById('toggleAll');
  toggle.onclick = () => {
    const rows = Array.from(document.querySelectorAll('.row'));
    const allOpen = rows.every((r) => r.classList.contains('open'));
    rows.forEach((row) => {
      row.classList.toggle('open', !allOpen);
      row.querySelector('.row-head').setAttribute('aria-expanded', String(!allOpen));
      if (!allOpen) fillBars(row);
    });
    syncToggle();
  };

  syncToggle();
}

document.querySelectorAll('.sort-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    renderList();
  });
});

renderList();
