# hfs configuration
# 以 # 或 ; 开头为注释行
# 布尔值接受 1/0、true/false、yes/no、on/off

# 监听地址，0.0.0.0 表示所有网卡
listen_address = 0.0.0.0

# 监听端口，范围 1-65535
listen_port = 8080

# 主目录（站点根目录）
document_root = .

# 目录访问时优先返回的文件名，留空则只显示自动索引
index_file = index.html

# 是否自动生成目录列表页
auto_index = 1

# 是否允许上传
enable_upload = 1

# 是否允许下载
enable_download = 1

# 文本响应字符集
default_charset = utf-8

# 单次上传字节上限，0 表示不限制
max_upload_size = 0
